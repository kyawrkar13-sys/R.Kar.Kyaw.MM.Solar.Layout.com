<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PV Layout Calculator</title>

<style>
body{
    font-family:Arial;
    background:#f4f6f8;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    max-width:420px;
    margin:auto;
    box-shadow:0 2px 10px #ccc;
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:10px;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#198754;
    color:white;
    border:0;
    border-radius:10px;
    font-size:16px;
}

.result{
    margin-top:20px;
    background:#eef7ff;
    padding:15px;
    border-radius:10px;
}
</style>

</head>


<body>

<div class="card">

<h2>☀️ PV Layout Calculator</h2>


<label>Site Length (m)</label>
<input id="length" type="number">


<label>Site Width (m)</label>
<input id="width" type="number">


<label>Setback Distance (m)</label>
<input id="setback" type="number" value="1">


<label>Panel Watt</label>
<select id="watt">
<option value="615">615W</option>
<option value="650" selected>650W</option>
<option value="700">700W</option>
<option value="720">720W</option>
<option value="750">750W</option>
</select>


<label>Panel Length (m)</label>
<input id="pl" type="number" value="2.4">


<label>Panel Width (m)</label>
<input id="pw" type="number" value="1.3">


<label>Row Spacing (m)</label>
<input id="row" type="number" value="2">


<label>Walkway Spacing (m)</label>
<input id="walk" type="number" value="1">


<button onclick="calculate()">
Calculate
</button>


<div class="result" id="output">
Result will show here
</div>


</div>



<script>

function calculate(){

let L = Number(document.getElementById("length").value);
let W = Number(document.getElementById("width").value);

let SB = Number(document.getElementById("setback").value);

let watt = Number(document.getElementById("watt").value);

let PL = Number(document.getElementById("pl").value);
let PW = Number(document.getElementById("pw").value);

let RS = Number(document.getElementById("row").value);
let WW = Number(document.getElementById("walk").value);


// usable area

let usableL = L - (SB*2);
let usableW = W - (SB*2);


// panel count

let column = Math.floor(
    usableL / (PW + WW)
);

let row = Math.floor(
    usableW / (PL + RS)
);


let qty = column * row;


// DC capacity

let dc = qty * watt / 1000;


// inverter

let inverter = dc / 1.2;



document.getElementById("output").innerHTML =

`
<b>PV Layout Result</b><br><br>

Usable Length : ${usableL.toFixed(2)} m<br>
Usable Width : ${usableW.toFixed(2)} m<br><br>

Panel Column : ${column}<br>
Panel Row : ${row}<br>

<b>Total Panel Qty : ${qty} pcs</b><br><br>

Panel Watt : ${watt} W<br>

<b>Total DC : ${dc.toFixed(2)} kW</b><br><br>

Recommended Inverter :
<b>${Math.ceil(inverter)} kW</b>

`;

}

</script>
