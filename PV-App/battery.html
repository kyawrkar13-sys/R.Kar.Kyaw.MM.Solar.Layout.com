<body>

<div class="card">

<h2>🔋 Battery Design</h2>


<label>Load Power (kW)</label>
<input id="load" type="number" value="100">


<label>Backup Time (Hour)</label>
<input id="hour" type="number" value="2">


<label>Battery Voltage</label>
<input id="volt" type="number" value="512">


<button onclick="calculateBattery()">
Calculate
</button>


<div class="result" id="result">
</div>


</div>

<script>

function calculateBattery(){

let load =
Number(document.getElementById("load").value);

let hour =
Number(document.getElementById("hour").value);


let energy =
load * hour;


document.getElementById("result").innerHTML=

`
Battery Energy Required:<br>

<b>${energy} kWh</b>

`;

}

</script>
