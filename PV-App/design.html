<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PV Design TEST</title>

<style>

body{
font-family:Arial;
background:#f3f5f7;
padding:15px;
}


.card{
background:white;
padding:15px;
border-radius:15px;
max-width:600px;
margin:auto;
}


input,button{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:1px solid #ccc;
}


button{
background:#198754;
color:white;
font-size:16px;
border:none;
}


#layout{

margin-top:20px;
border:2px solid #333;
padding:10px;
background:#fff;
overflow:auto;

}


.site{

position:relative;
border:3px solid green;
margin:auto;
background:#fafafa;

display:grid;

}


.panel{

background:#ffd966;
border:1px solid #555;
font-size:8px;
display:flex;
align-items:center;
justify-content:center;

}


.road{

background:#555;
color:white;
text-align:center;
padding:8px;

}


.north{

text-align:center;
font-size:25px;

}


.result{

margin-top:15px;
background:#eef7ff;
padding:10px;
border-radius:10px;

}

</style>


</head>


<body>


<div class="card">


<h2>☀️ PV Layout Design TEST</h2>


<label>Site Length (m)</label>
<input id="length" value="50">


<label>Site Width (m)</label>
<input id="width" value="30">


<label>Setback (m)</label>
<input id="setback" value="2">


<label>Panel Length (m)</label>
<input id="pl" value="2.4">


<label>Panel Width (m)</label>
<input id="pw" value="1.3">


<button onclick="drawLayout()">
Generate Layout
</button>



<div class="result" id="result"></div>


<div id="layout">

<div class="north">
↑ NORTH
</div>

<div id="site"></div>

<div class="road">
ROAD / ACCESS
</div>

</div>


</div>



<script>


function drawLayout(){


let L=Number(document.getElementById("length").value);
let W=Number(document.getElementById("width").value);
let SB=Number(document.getElementById("setback").value);


let PL=Number(document.getElementById("pl").value);
let PW=Number(document.getElementById("pw").value);



let usableL=L-(SB*2);
let usableW=W-(SB*2);



let col=Math.floor(usableL/PW);

let row=Math.floor(usableW/PL);


let qty=col*row;



let site=document.getElementById("site");

site.innerHTML="";


site.style.width="100%";

site.style.gridTemplateColumns=
`repeat(${col},1fr)`;


for(let i=0;i<qty;i++){

let p=document.createElement("div");

p.className="panel";

p.innerHTML="PV";

site.appendChild(p);

}



document.getElementById("result").innerHTML=

`
<b>Layout Result</b><br><br>

Usable Area:
${usableL.toFixed(1)}m × ${usableW.toFixed(1)}m

<br><br>

Panel Row:
${row}

<br>

Panel Column:
${col}

<br><br>

<b>Total Panel:
${qty} pcs</b>

`;



}


</script>
